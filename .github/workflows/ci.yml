name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks and browser tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # The browser suite takes about 26 minutes in one piece; four shards keep each job under 15.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint, zero warnings)
        run: npm run lint

      - name: Formatting (Prettier)
        run: npm run format:check

      - name: Type check (tsc over api/ and the pure modules, jsconfig.json)
        run: npm run typecheck

      - name: Built pages match their templates and every text has es/pt translations
        run: npm run check:pages

      - name: Unit tests
        run: npm run test:unit

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # The one check main's branch protection requires (by this name, from before
  # the suite was split into shards): green only when every shard passed.
  all:
    name: Lint, format, pages in sync, unit and browser tests
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.checks.result }}" = success ]'

  # iOS Safari's engine (WebKit, iPhone 13 preset): the phone first-screen
  # test and the /admin page. Its own job, outside the required check above,
  # so a WebKit-on-Linux quirk can't block a merge; read its result on main.
  webkit:
    name: WebKit iPhone smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install WebKit for Playwright
        run: npx playwright install --with-deps webkit

      - name: WebKit tests
        run: npx playwright test --project=webkit-iphone
        env:
          E2E_WEBKIT: "1"
