name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, format, pages in sync, unit and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint, zero warnings)
        run: npm run lint

      - name: Formatting (Prettier)
        run: npm run format:check

      - name: Type check (tsc over api/ and the pure modules, jsconfig.json)
        run: npm run typecheck

      - name: Built pages match their templates and every text has es/pt translations
        run: npm run check:pages

      - name: Unit tests
        run: npm run test:unit

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
