name: Backup heartbeat

# A schedule that stops firing sends no failure email, so this second
# schedule (a different hour) fails, and GitHub emails the owner, when the
# last successful "Database backup" run is more than 36 hours old.
# Paused 2026-10-27 at Thomas's request (no automatic runs). To resume,
# restore the trigger(s) noted below. Manual runs still work from the Actions tab.
# Was: schedule cron "43 15 * * *".
on:
  workflow_dispatch:

permissions:
  actions: read

jobs:
  heartbeat:
    name: Last backup is recent
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the newest successful backup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/backup.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].created_at // empty')
          if [ -z "$last" ]; then echo "::error::No successful database backup run found."; exit 1; fi
          age=$(( ($(date +%s) - $(date -d "$last" +%s)) / 3600 ))
          echo "Last successful backup: $age hours ago."
          if [ "$age" -gt 36 ]; then echo "::error::The last successful backup is $age hours old (expected every 24). Check the Database backup workflow is still scheduled."; exit 1; fi
