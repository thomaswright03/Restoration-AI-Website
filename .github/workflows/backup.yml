name: Database backup

# Every day, a copy of the live Supabase database (the public tables and
# the sign-in accounts), encrypted with BACKUP_PASSPHRASE, kept as a workflow
# artifact for 90 days. The repo is public, so nothing unencrypted is ever
# stored. Each run then restores the backup into an empty Postgres and checks
# every table comes back with the same row count. How to restore:
# docs/backups.md.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Encrypted database backup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The empty database each backup is test-restored into.
    services:
      scratch:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: scratch
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check the secrets are set
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Set the SUPABASE_DB_URL and BACKUP_PASSPHRASE repository secrets (docs/backups.md)."
            exit 1
          fi

      - uses: actions/checkout@v4

      # pg_dump must be at least the server's version; Supabase runs Postgres 15 or 17.
      - name: Install pg_dump 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump the database
        run: |
          set -euo pipefail
          PG=/usr/lib/postgresql/17/bin
          # A secret pasted with a trailing newline or spaces still works.
          DB=$(printf %s "$SUPABASE_DB_URL" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
          case "$DB" in
            *"[YOUR-PASSWORD]"*) echo "::error::SUPABASE_DB_URL still has [YOUR-PASSWORD] in it: put the database password there."; exit 1 ;;
          esac
          mkdir dump
          # Row counts are taken before and after the dump; if someone saved
          # something in between, dump again so the counts match the dump.
          for attempt in 1 2 3; do
            PG_BIN=$PG scripts/db-counts.sh "$DB" > dump/counts.txt
            # The app's tables, with their schema, policies and functions.
            $PG/pg_dump "$DB" --schema=public --no-owner --no-privileges -Fc -f dump/public.dump
            # The sign-in accounts (users and identities only; a new Supabase project already has the other auth tables).
            $PG/pg_dump "$DB" --table=auth.users --table=auth.identities --data-only -Fc -f dump/auth.dump
            # Their table definitions, used only by the test restore below.
            $PG/pg_dump "$DB" --table=auth.users --table=auth.identities --schema-only --no-owner --no-privileges -Fc -f dump/auth-schema.dump
            PG_BIN=$PG scripts/db-counts.sh "$DB" > dump/counts-after.txt
            if cmp -s dump/counts.txt dump/counts-after.txt; then break; fi
            [ "$attempt" != 3 ] || { echo "::error::The database kept changing during the backup."; exit 1; }
          done
          rm dump/counts-after.txt
          # A dump that can't be read back fails the run (and GitHub emails the failure).
          $PG/pg_restore --list dump/public.dump | grep -q "TABLE DATA public subscriptions"
          $PG/pg_restore --list dump/auth.dump | grep -q "TABLE DATA auth users"
          ls -l dump

      - name: Encrypt
        run: |
          set -euo pipefail
          name="db-backup-$(date -u +%Y-%m-%d)"
          tar -czf - dump | gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase-file <(printf %s "$BACKUP_PASSPHRASE") -o "$name.tar.gz.gpg"
          rm -rf dump
          echo "NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error

      # Restores from the encrypted file just uploaded, as a real restore
      # would. Prints only table names and match/MISMATCH: the logs are public.
      - name: Test-restore the backup
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          gpg --batch --pinentry-mode loopback --decrypt --passphrase-file <(printf %s "$BACKUP_PASSPHRASE") \
            "$NAME.tar.gz.gpg" | tar -xzf - -C "$work"
          PG_BIN=/usr/lib/postgresql/17/bin scripts/restore-check.sh "$work/dump" \
            "postgresql://postgres:scratch@localhost:5432/postgres"
          rm -rf "$work"
